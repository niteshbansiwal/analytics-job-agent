name: Atlas GitHub counter (independent test)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-github-counter
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Record five real minute heartbeats (counter only)
        env:
          ATLAS_CRON_SECRET: ${{ secrets.ATLAS_CRON_SECRET }}
        run: |
          if [ -z "$ATLAS_CRON_SECRET" ]; then
            echo "Missing ATLAS_CRON_SECRET; no counter updates occurred." >&2
            exit 1
          fi
          for n in 1 2 3 4 5; do
            echo "Counter-only heartbeat $n/5 at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            curl --fail-with-body --silent --show-error --max-time 20 --retry 1 --retry-delay 2 \
              -X POST --header "Authorization: Bearer $ATLAS_CRON_SECRET" \
              https://analytics-job-agent.vercel.app/api/cron/github-counter
            echo
            if [ "$n" -lt 5 ]; then sleep 60; fi
          done
