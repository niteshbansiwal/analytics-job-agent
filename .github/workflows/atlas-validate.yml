name: Atlas Python and frontend validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile every Python source file
        run: python -m compileall -q app main.py
      - name: Verify JS syntax
        run: node --check public/app.js
      - name: Verify HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('public/index.html').read_text()
          assert '<script ' in html and '</script>' in html
          assert 'src="/app.js' in html and 'src="/email-controls.js' in html
          assert '<style>' in html and '</style>' in html
          PY
